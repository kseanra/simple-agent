<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PDF Q&amp;A Agent</title>
<!-- Markdown rendering for assistant answers: marked turns the LLM's
     Markdown (bold, lists, links, code, ...) into HTML; DOMPurify sanitizes
     that HTML before it's inserted into the page. The sanitizing step
     matters here specifically because the HTML we're rendering originates
     from an LLM answer that was built from *retrieved PDF content* -- a
     PDF (or a cleverly-worded question) could otherwise smuggle in a
     script tag or similar. Pinned versions, loaded from jsDelivr. -->
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --border: #e0e2e7;
    --text: #1f2430;
    --muted: #6b7280;
    --accent: #2f6feb;
    --accent-contrast: #ffffff;
    --user-bubble: #2f6feb;
    --assistant-bubble: #eef1f6;
    --error: #c0392b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 14px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    margin: 0;
    font-size: 16px;
    font-weight: 600;
  }
  header p {
    margin: 2px 0 0;
    font-size: 12px;
    color: var(--muted);
  }
  main {
    flex: 1;
    display: flex;
    min-height: 0;
  }
  .sidebar {
    width: 280px;
    flex-shrink: 0;
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 16px;
    overflow-y: auto;
  }
  .sidebar h2 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin: 0 0 8px;
  }
  #upload-form {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 20px;
  }
  #upload-form input[type="file"] {
    font-size: 12px;
  }
  button {
    font: inherit;
    border: none;
    border-radius: 6px;
    padding: 8px 12px;
    cursor: pointer;
    background: var(--accent);
    color: var(--accent-contrast);
  }
  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  #doc-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  #doc-list li {
    border-radius: 6px;
    padding: 8px 10px;
    cursor: pointer;
    font-size: 13px;
    border: 1px solid transparent;
  }
  #doc-list li:hover {
    background: var(--assistant-bubble);
  }
  #doc-list li.active {
    background: #e7f0ff;
    border-color: var(--accent);
  }
  #doc-list li .fname {
    display: block;
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #doc-list li .meta {
    display: block;
    font-size: 11px;
    color: var(--muted);
  }
  .chat-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .bubble {
    max-width: 70%;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.45;
    white-space: pre-wrap;
  }
  .bubble.user {
    align-self: flex-end;
    background: var(--user-bubble);
    color: white;
    border-bottom-right-radius: 2px;
  }
  .bubble.assistant {
    align-self: flex-start;
    background: var(--assistant-bubble);
    color: var(--text);
    border-bottom-left-radius: 2px;
    /* Rendered Markdown supplies its own line breaks via block elements
       (<p>, <li>, ...), unlike the plain-text user/error bubbles above --
       so this bubble shouldn't also preserve raw newlines/whitespace. */
    white-space: normal;
  }
  .bubble.error {
    align-self: flex-start;
    background: #fdecea;
    color: var(--error);
    border: 1px solid #f5c6c2;
  }
  /* Rendered Markdown inside an assistant bubble: reset block-element
     margins that would otherwise add unwanted gaps, and style the bits
     Markdown commonly produces (lists, inline code, links). */
  .bubble.assistant :first-child { margin-top: 0; }
  .bubble.assistant :last-child { margin-bottom: 0; }
  .bubble.assistant p { margin: 0 0 8px; }
  .bubble.assistant ul,
  .bubble.assistant ol {
    margin: 0 0 8px;
    padding-left: 20px;
  }
  .bubble.assistant li { margin: 2px 0; }
  .bubble.assistant code {
    background: rgba(0, 0, 0, 0.08);
    border-radius: 4px;
    padding: 1px 5px;
    font-size: 0.9em;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .bubble.assistant pre {
    background: rgba(0, 0, 0, 0.08);
    border-radius: 6px;
    padding: 10px;
    overflow-x: auto;
    margin: 0 0 8px;
  }
  .bubble.assistant pre code { background: none; padding: 0; }
  .bubble.assistant a { color: inherit; text-decoration: underline; }
  .empty-state {
    margin: auto;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    max-width: 320px;
  }
  #chat-form {
    display: flex;
    gap: 8px;
    padding: 14px 20px;
    border-top: 1px solid var(--border);
    background: var(--panel);
  }
  #question-input {
    flex: 1;
    font: inherit;
    font-size: 14px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  #status-line {
    font-size: 11px;
    color: var(--muted);
    padding: 0 20px 8px;
  }
</style>
</head>
<body>

<header>
  <h1>PDF Q&amp;A Agent</h1>
  <p>Upload a PDF, pick it on the left, ask questions about it on the right.</p>
</header>

<main>
  <aside class="sidebar">
    <h2>Upload</h2>
    <form id="upload-form">
      <input type="file" id="file-input" accept="application/pdf" required />
      <button type="submit" id="upload-button">Index PDF</button>
    </form>

    <h2>Documents</h2>
    <ul id="doc-list"></ul>
  </aside>

  <section class="chat-area">
    <div id="messages">
      <div class="empty-state" id="empty-state">
        Upload a PDF, then select it to start asking questions.
      </div>
    </div>
    <div id="status-line"></div>
    <form id="chat-form">
      <input
        type="text"
        id="question-input"
        placeholder="Ask a question about the selected document..."
        autocomplete="off"
        disabled
      />
      <button type="submit" id="send-button" disabled>Send</button>
    </form>
  </section>
</main>

<script>
  // A per-browser-tab conversation id, persisted in localStorage so a page
  // refresh continues the same conversation (as far as the server's
  // in-memory session store remembers it -- restarting the server clears
  // this, since sessions live in a Python dict, not a database).
  function getSessionId() {
    let id = localStorage.getItem("pdf_qa_session_id");
    if (!id) {
      id = crypto.randomUUID();
      localStorage.setItem("pdf_qa_session_id", id);
    }
    return id;
  }

  const sessionId = getSessionId();
  let activeDocumentId = null;
  let documents = [];

  const uploadForm = document.getElementById("upload-form");
  const fileInput = document.getElementById("file-input");
  const uploadButton = document.getElementById("upload-button");
  const docList = document.getElementById("doc-list");
  const messagesEl = document.getElementById("messages");
  const emptyState = document.getElementById("empty-state");
  const statusLine = document.getElementById("status-line");
  const chatForm = document.getElementById("chat-form");
  const questionInput = document.getElementById("question-input");
  const sendButton = document.getElementById("send-button");

  function setStatus(text) {
    statusLine.textContent = text || "";
  }

  function renderDocList() {
    docList.innerHTML = "";
    for (const doc of documents) {
      const li = document.createElement("li");
      li.className = doc.document_id === activeDocumentId ? "active" : "";
      li.innerHTML = `
        <span class="fname">${escapeHtml(doc.filename)}</span>
        <span class="meta">${doc.chunks} chunks</span>
      `;
      li.addEventListener("click", () => selectDocument(doc.document_id));
      docList.appendChild(li);
    }
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function addBubble(role, text) {
    emptyState.remove();
    const bubble = document.createElement("div");
    bubble.className = `bubble ${role}`;
    if (role === "assistant") {
      // The agent's answer is Markdown (it often bolds a term, lists a few
      // points, or quotes a short passage). Render it to HTML with marked,
      // then sanitize that HTML with DOMPurify before inserting it -- the
      // text ultimately traces back to PDF content and a user question,
      // neither of which this page should ever trust as raw HTML/script.
      const html = marked.parse(text, { breaks: true });
      bubble.innerHTML = DOMPurify.sanitize(html);
    } else {
      // User questions and our own error messages are plain text -- no
      // Markdown rendering needed, and textContent is inherently safe.
      bubble.textContent = text;
    }
    messagesEl.appendChild(bubble);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return bubble;
  }

  function selectDocument(documentId) {
    activeDocumentId = documentId;
    renderDocList();
    questionInput.disabled = false;
    sendButton.disabled = false;
    questionInput.focus();
    setStatus(
      `Chatting with "${
        documents.find((d) => d.document_id === documentId)?.filename ?? documentId
      }". Selecting a different document starts a new conversation.`
    );
  }

  async function refreshDocuments(selectId) {
    const res = await fetch("/api/documents");
    documents = await res.json();
    renderDocList();
    if (selectId) selectDocument(selectId);
  }

  uploadForm.addEventListener("submit", async (event) => {
    event.preventDefault();
    const file = fileInput.files[0];
    if (!file) return;

    uploadButton.disabled = true;
    setStatus(`Indexing "${file.name}"... this can take a moment for large PDFs.`);

    const formData = new FormData();
    formData.append("file", file);

    try {
      const res = await fetch("/api/documents", { method: "POST", body: formData });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || `Upload failed (${res.status})`);
      }
      const doc = await res.json();
      setStatus(
        doc.reused
          ? `"${doc.filename}" was already indexed (${doc.chunks} chunks) -- reusing it.`
          : `Indexed "${doc.filename}" into ${doc.chunks} chunks.`
      );
      await refreshDocuments(doc.document_id);
      fileInput.value = "";
    } catch (err) {
      setStatus(err.message);
    } finally {
      uploadButton.disabled = false;
    }
  });

  chatForm.addEventListener("submit", async (event) => {
    event.preventDefault();
    const question = questionInput.value.trim();
    if (!question || !activeDocumentId) return;

    addBubble("user", question);
    questionInput.value = "";
    questionInput.disabled = true;
    sendButton.disabled = true;
    setStatus("Thinking...");

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          session_id: sessionId,
          document_id: activeDocumentId,
          question,
        }),
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || `Request failed (${res.status})`);
      }
      const data = await res.json();
      addBubble("assistant", data.answer);
      setStatus("");
    } catch (err) {
      addBubble("error", err.message);
      setStatus("");
    } finally {
      questionInput.disabled = false;
      sendButton.disabled = false;
      questionInput.focus();
    }
  });

  refreshDocuments();
</script>

</body>
</html>
